# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G08
owner: "daoquangtuan (Data Protection Lead)"   # mandatory for every Decision
track_config: tracks/t08.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t08                        # must match track_config
input: fixtures/t08_deletion      # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). FROZEN 2026-11-14 before any evaluation.
params:
  dry_run: false                  # false = run the mock deletion + write deletion_evidence.csv
  hold_scope: copies              # legal hold covers the artefact + its exact copies (backup); see metric_contract.md
  operator_role: data-platform    # role executing deletions; artefacts whose ACL lacks it -> escalate
  review_file: reports/review_queue_reviewed.csv   # human decisions (used when out/<run>/review_queue_reviewed.csv is absent)
